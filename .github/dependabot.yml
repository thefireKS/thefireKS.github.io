version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    groups:
      astro-stack:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "astro-icon"
      iconify:
        patterns:
          - "@iconify-json/*"
          - "@iconify/*"
      tooling:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
          - "sharp"
          - "tailwindcss"
          - "typescript"
          - "zod"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
